name: nats

services:
  nats:
    container_name: nats
    image: 'nats:latest'
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222"
    hostname: nats-server
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1

  nats-1:
    container_name: nats-1
    image: 'nats:latest'
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222"
    hostname: nats-1-server
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
    depends_on: ["nats"]

  nats-2:
    container_name: nats-2
    image: 'nats:latest'
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222"
    hostname: nats-2-server
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
    depends_on: ["nats"]

networks:
  backend:
    name: backend-network