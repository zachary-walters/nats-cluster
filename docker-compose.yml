services:
  nats-1:
    command:
      - "--debug"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--http_port"
      - "8222"
      - "--port"
      - "4222"
      - "--js"
      - "--name=nats-1"
      - "--cluster_name=c1"
      - "--routes=nats-route://nats-1:6222,nats-route://nats-2:6222,nats-route://nats-3:6222"
    image: "nats:latest"
    networks:
      - backend
    ports:
      - "14222:4222"
      - "18222:8222"
  nats-2:
